<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BERU — Dashboard</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px}
input{padding:8px;margin:5px}
.card{background:#1a1a1a;padding:20px;border-radius:10px;margin-bottom:20px}
</style>
</head>
<body>

<h2>🧪 Production Calculator</h2>

<div class="card">
  <h3>Inventory</h3>

  Bottles <input id="bottles" type="number"><br>
  Alcohol (ml) <input id="alcohol" type="number"><br>
  Perfume oil (ml) <input id="perfume" type="number"><br>
  Cremophore (ml) <input id="cremophore" type="number"><br>
  Tween 20 (ml) <input id="tween" type="number"><br>
  PG (ml) <input id="pg" type="number"><br>
  Glycerin (ml) <input id="glycerin" type="number"><br>
  Phenoxy (ml) <input id="phenoxy" type="number"><br>
  Sorbate (ml) <input id="sorbate" type="number"><br>
  Water (ml) <input id="water" type="number"><br>

  <br><button onclick="calc()">احسب الإنتاج</button>
</div>

<div class="card">
  <h3>النتيجة</h3>
  <div id="result">—</div>
</div>

<script>

// الفورميلا لكل 240ml
const FORMULA = {
  perfume: 24,
  cremophore: 7.2,
  tween: 7.2,
  pg: 4.8,
  glycerin: 4.8,
  phenoxy: 1.2,
  sorbate: 0.48,
  alcohol: 99.6,
  water: 93.6
};

function calc() {

  const inv = {
    bottles: +document.getElementById('bottles').value || 0,
    alcohol: +document.getElementById('alcohol').value || 0,
    perfume: +document.getElementById('perfume').value || 0,
    cremophore: +document.getElementById('cremophore').value || 0,
    tween: +document.getElementById('tween').value || 0,
    pg: +document.getElementById('pg').value || 0,
    glycerin: +document.getElementById('glycerin').value || 0,
    phenoxy: +document.getElementById('phenoxy').value || 0,
    sorbate: +document.getElementById('sorbate').value || 0,
    water: +document.getElementById('water').value || 0,
  };

  const possible = [];

  if(inv.bottles) possible.push(inv.bottles);
  if(inv.alcohol) possible.push(Math.floor(inv.alcohol / FORMULA.alcohol));
  if(inv.perfume) possible.push(Math.floor(inv.perfume / FORMULA.perfume));
  if(inv.cremophore) possible.push(Math.floor(inv.cremophore / FORMULA.cremophore));
  if(inv.tween) possible.push(Math.floor(inv.tween / FORMULA.tween));
  if(inv.pg) possible.push(Math.floor(inv.pg / FORMULA.pg));
  if(inv.glycerin) possible.push(Math.floor(inv.glycerin / FORMULA.glycerin));
  if(inv.phenoxy) possible.push(Math.floor(inv.phenoxy / FORMULA.phenoxy));
  if(inv.sorbate) possible.push(Math.floor(inv.sorbate / FORMULA.sorbate));
  if(inv.water) possible.push(Math.floor(inv.water / FORMULA.water));

  const result = Math.min(...possible);

  document.getElementById('result').innerText =
    result ? `تقدر تنتج ${result} عبوة` : 'دخل بيانات صح';
}

</script>

</body>
</html>
